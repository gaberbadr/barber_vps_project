
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: barber-api
    # DO NOT EXPOSE PUBLIC PORTS. NGINX will proxy to backend:8080
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      # These can override .env or provide defaults if necessary
      # but generally we rely on .env now.
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTPS_PORT: "443"
    volumes:
      - api_files:/app/wwwroot/files
    networks:
      - barber-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: barber-frontend
    # NGINX proxy to frontend:80
    expose:
      - "80"
    env_file:
      - .env
    networks:
      - barber-network
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: barber-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - barber-network
    restart: unless-stopped

volumes:
  api_files:


networks:
  barber-network:
    driver: bridge