
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: barber-api
    # DO NOT EXPOSE PUBLIC PORTS. NGINX will proxy to backend:8080
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # These can override .env or provide defaults if necessary
      # but generally we rely on .env now.
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    volumes:
      - api_files:/app/wwwroot/files
    networks:
      - barber-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: barber-frontend
    # NGINX proxy to frontend:80
    expose:
      - "80"
    env_file:
      - .env
    networks:
      - barber-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: barber-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: project1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - barber-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: barber-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - barber-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: barber-nginx
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - barber-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: barber-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Entrypoint to run renewal loop. It sleeps 12h, renews, then tells nginx to reload via docker network? 
    # Actually certbot container doesn't have docker socket. A common trick is a loop in certbot and polling in nginx, OR just mapping a script.
    # We will use the standard loop for certbot.
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"
    networks:
      - barber-network
    restart: unless-stopped

volumes:
  postgres_data:
  api_files:
  redis_data:
  certbot_www:
  certbot_certs:

networks:
  barber-network:
    driver: bridge