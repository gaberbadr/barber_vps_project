events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Map WebSocket headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Preserve forwarded protocol from upstream edge reverse proxy (Blitz.cloud)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name gaber.blitz.cloud barber.devs.surf *.blitz.cloud localhost _;

        # Ensure internal redirects remain relative and do not downgrade HTTPS to HTTP
        absolute_redirect off;

        # Support file uploads up to 20MB
        client_max_body_size 20M;

        # Upgrade plain HTTP to HTTPS if requested via unencrypted connection
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend:8080/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Backend API (matches /api and /api/...)
        location /api {
            proxy_pass http://backend:8080/api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Google OAuth external authentication callback
        location /signin-google {
            proxy_pass http://backend:8080/signin-google;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Static files (wwwroot/files) served by backend
        location /files {
            proxy_pass http://backend:8080/files;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        # Swagger documentation (matches /swagger and /swagger/...)
        location /swagger {
            proxy_pass http://backend:8080/swagger;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Redirect /pgadmin to /pgadmin/ (preserving HTTPS from edge reverse proxy)
        location = /pgadmin {
            return 301 /pgadmin/;
        }

        # pgAdmin 4 Administration Interface
        location /pgadmin/ {
            # Additional Access Restriction: HTTP Basic Authentication
            auth_basic "pgAdmin Restricted Administrative Area";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://pgadmin:80/;
            proxy_http_version 1.1;

            # Clear client's basic auth header before forwarding so pgAdmin
            # session and form authentication function cleanly
            proxy_set_header Authorization "";

            # WebSocket upgrade support (used by pgAdmin for Query Tool / Terminal)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forward Host and client IP headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Critical for pgAdmin subpath routing:
            # Overwrite any client-supplied X-Script-Name header to prevent spoofing
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header X-Scheme $forwarded_proto;

            # Adjust Set-Cookie path from upstream root to /pgadmin
            proxy_cookie_path / /pgadmin;

            # Disable proxy redirects rewrite since SCRIPT_NAME handles subpath URLs
            proxy_redirect off;

            # Disable buffering for real-time query output and terminal streaming
            proxy_buffering off;

            # Extended timeouts for long-running database queries and backups
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Frontend React App (SPA)
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}

