events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Map WebSocket headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name barber.devs.surf;
        
        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP requests to HTTPS (if certificates exist, otherwise comment out or handle gracefully)
        # Note: If no certificates exist, Nginx might fail to start if the 443 block is active. 
        # A helper script usually manages this, but for simplicity we will conditionally redirect if needed, 
        # but the prompt requires Nginx to handle both 80 and 443 and the production VPS will have them.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name barber.devs.surf;

        # These paths are standard for certbot
        # If certificates do not exist yet (e.g. first run), Nginx might fail.
        # Ensure dummy certificates exist or use an init script to handle the first run.
        ssl_certificate /etc/letsencrypt/live/barber.devs.surf/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/barber.devs.surf/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Backend API
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files (wwwroot/files) served by backend
        location /files/ {
            proxy_pass http://backend:8080/files/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Swagger
        location /swagger/ {
            proxy_pass http://backend:8080/swagger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Frontend React App
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
